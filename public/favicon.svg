<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Chevron Neon Gradient -->
    <linearGradient id="chevronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#06b6d4" opacity="0.15" filter="url(#softGlow)"/>

  <!-- Base App Icon Squircle Container -->
  <rect x="10" y="10" width="108" height="108" rx="26" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Subtle Top Window Bar Accent -->
  <path d="M 12 36 L 116 36" stroke="#1e293b" stroke-width="2"/>
  <circle cx="28" cy="24" r="3.5" fill="#f43f5e" opacity="0.85"/>
  <circle cx="40" cy="24" r="3.5" fill="#fbbf24" opacity="0.85"/>
  <circle cx="52" cy="24" r="3.5" fill="#10b981" opacity="0.85"/>

  <!-- 4-Grid Windows Modern Logo Accent (Top Right) -->
  <g transform="translate(86, 17) scale(0.7)">
    <rect x="0" y="0" width="8" height="8" rx="1.5" fill="#38bdf8"/>
    <rect x="11" y="0" width="8" height="8" rx="1.5" fill="#0284c7"/>
    <rect x="0" y="11" width="8" height="8" rx="1.5" fill="#06b6d4"/>
    <rect x="11" y="11" width="8" height="8" rx="1.5" fill="#10b981"/>
  </g>

  <!-- Glowing Terminal Prompt Chevron (>) -->
  <polyline
    points="32,54 52,72 32,90"
    fill="none"
    stroke="url(#chevronGrad)"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- Glowing Terminal Cursor Line (_) -->
  <line
    x1="64"
    y1="90"
    x2="94"
    y2="90"
    stroke="#10b981"
    stroke-width="9"
    stroke-linecap="round"
    filter="url(#neonGlow)"
  />

  <!-- Subtle Central Energy Sparkle -->
  <circle cx="68" cy="62" r="2" fill="#a5f3fc" opacity="0.75"/>
</svg>
